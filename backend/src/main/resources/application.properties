# ========================
# SERVER
# ========================
server.port=${PORT:8080}

# ========================
# DATABASE (MySQL)
# ========================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ========================
# JWT
# ========================
app.jwt.secret=${JWT_SECRET}
app.jwt.accessTokenExpirationMs=${JWT_ACCESS_EXPIRY:86400000}
app.jwt.refreshTokenExpirationMs=${JWT_REFRESH_EXPIRY:604800000}

# ========================
# CORS
# ========================
app.cors.allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# ========================
# Cloudinary
# ========================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_FOLDER:products}

# ========================
# Razorpay
# ========================
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# ========================
# SendGrid
# ========================
sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from-email=${SENDGRID_FROM_EMAIL}
